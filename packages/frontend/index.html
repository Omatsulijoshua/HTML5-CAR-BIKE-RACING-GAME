<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Racing Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .interactive {
            pointer-events: auto;
        }
        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff3b30;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            max-width: 400px;
            margin: auto;
        }
        h1 {
            margin-top: 0;
            color: #ff3b30;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e02d22;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <div></div>
        <div class="card interactive">
            <h1>Arcade Racing</h1>
            <p>Phase 1: Project Foundation Loaded Successfully!</p>
            <button id="test-btn">Start Game</button>
            <div id="status-text" style="margin-top: 10px; font-size: 12px; color: #aaa;">
                Checking connection to backend...
            </div>
        </div>
        <div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
