<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Racing Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .interactive {
            pointer-events: auto;
        }
        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff3b30;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            max-width: 400px;
            margin: auto;
        }
        h1 {
            margin-top: 0;
            color: #ff3b30;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e02d22;
        }
        
        /* Mobile Touch Controls Overlay */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            z-index: 20;
            pointer-events: none;
            box-sizing: border-box;
            padding: 0 30px;
            justify-content: space-between;
        }
        .touch-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
            user-select: none;
            touch-action: none;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
        }
        .touch-btn:active {
            background: rgba(255, 59, 48, 0.65);
            border-color: #ff3b30;
            transform: scale(0.9);
        }
        .touch-btn.accent {
            background: rgba(255, 59, 48, 0.3);
            border-color: rgba(255, 59, 48, 0.6);
        }
        .touch-btn.secondary {
            background: rgba(0, 122, 255, 0.3);
            border-color: rgba(0, 122, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <div></div>
        <div class="card interactive">
            <h1>Arcade Racing</h1>
            <p>Phase 1: Project Foundation Loaded Successfully!</p>
            <button id="test-btn">Start Game</button>
            <div id="status-text" style="margin-top: 10px; font-size: 12px; color: #aaa;">
                Checking connection to backend...
            </div>
            <div style="margin-top: 12px; font-size: 10px; color: #888; text-transform: uppercase;">
                Press C for Car | B for Bike
            </div>
        </div>
        <div></div>
    </div>

    <!-- Racing HUD Overlay -->
    <div id="hud" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; padding: 25px; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
        <!-- Top Stats Row -->
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div id="hud-lap" style="font-size: 28px; color: #ff3b30; letter-spacing: 1px;">LAP 1/3</div>
            <div id="hud-timer" style="font-size: 28px; color: #ffffff; font-family: monospace;">TIME: 0.0s</div>
        </div>
        
        <!-- Center Banner Notification -->
        <div style="position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%;">
            <div id="hud-banner" style="font-size: 48px; color: #39ff14; letter-spacing: 3px; display: none; text-transform: uppercase;">CHECKPOINT!</div>
        </div>

        <!-- Bottom Row (Speed and Nitro status) -->
        <div style="position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
            <div style="display: flex; align-items: baseline; gap: 5px;">
                <div id="hud-speed" style="font-size: 44px; color: #ffffff;">0</div>
                <div style="font-size: 16px; color: #888;">KM/H</div>
            </div>
            <!-- Nitro fuel bar -->
            <div style="width: 150px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #007aff; border-radius: 5px; overflow: hidden;">
                <div id="hud-nitro-bar" style="width: 100%; height: 100%; background: #007aff; transition: width 0.1s;"></div>
            </div>
            <div style="font-size: 10px; color: #007aff; text-transform: uppercase;">Nitro</div>
        </div>
    </div>

    <!-- Mobile Touch Controls Overlay -->
    <div id="mobile-controls">
        <!-- Left Side: Steering -->
        <div class="touch-group">
            <div id="btn-left" class="touch-btn">&larr; STEER</div>
            <div id="btn-right" class="touch-btn">STEER &rarr;</div>
        </div>
        <!-- Right Side: Driving actions -->
        <div class="touch-group">
            <div id="btn-drift" class="touch-btn secondary">DRIFT</div>
            <div id="btn-brake" class="touch-btn accent">BRAKE</div>
            <div id="btn-gas" class="touch-btn accent">GAS</div>
            <div id="btn-nitro" class="touch-btn secondary">NITRO</div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
