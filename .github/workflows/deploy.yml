name: CI/CD Build pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma client structures
      run: npm run db:generate --workspace=@racing-game/backend

    - name: Compile and Build monorepo packages
      run: npm run build

    - name: Verify build artifacts
      run: |
        test -d packages/frontend/dist
        test -d packages/backend/dist
        test -d packages/shared/dist

  docker-build-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build local Docker image
      run: docker build -t racing-game:latest .
